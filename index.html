<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Vkroč Štúdio</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Segoe UI,sans-serif;background:linear-gradient(#0d1b2a,#111);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding-top:env(safe-area-inset-top);display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap;background:#0d1b2acc;border-bottom:1px solid #1e2f44}
h1{font-size:19px;margin:0 14px 0 0}h1 span{color:#9fb3c8;font-weight:400;font-size:14px}
button,.btn{font:inherit;border:0;background:#1e2f44;color:#fff;border-radius:12px;padding:9px 14px;cursor:pointer}
button:hover{filter:brightness(1.2)}button.on{background:#1e6fd9}.tab.on{background:#1e6fd9}.go{background:#2a9d6f;font-weight:600}
.sep{width:1px;height:28px;background:#1e2f44}label{font-size:14px;color:#9fb3c8;display:flex;gap:6px;align-items:center}
input[type=number]{width:64px;font:inherit;padding:4px;border-radius:8px;border:0}
main{flex:1;position:relative;min-height:0}.scr{position:absolute;inset:0;display:none}.scr.on{display:block}
#cv{width:100%;height:100%;display:block;background:#f7f8fa;touch-action:none}
#hint{position:absolute;left:12px;bottom:12px;background:#111827e0;padding:8px 12px;border-radius:10px;font-size:13.5px;pointer-events:none;max-width:70%}
#v3{width:100%;height:100%}#st{position:absolute;left:12px;top:12px;background:#111827e0;padding:8px 12px;border-radius:10px;font-size:13.5px}
#VRButton{background:#1e6fd9!important;border-radius:999px!important;opacity:1!important;border:0!important;font-size:16px!important}
.tb{display:none;gap:8px;align-items:center;flex-wrap:wrap}.tb.on{display:flex}
#dd{display:none;position:absolute;top:44px;left:0;background:#0d1b2a;border:1px solid #1e2f44;border-radius:12px;z-index:20;min-width:250px;box-shadow:0 6px 24px #000a}#dd.on{display:block}#dd a{display:block;padding:11px 16px;cursor:pointer}#dd a:hover{background:#1e2f44}
.hw{max-width:820px;margin:0 auto;padding:26px 16px;overflow:auto;height:100%}.big{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}.big button{font-size:18px;padding:16px 22px}
#plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.pc{background:#1e2f44;border-radius:16px;padding:16px;cursor:pointer;position:relative}.pc:hover{background:#25405f}.pc b{display:block;font-size:17px}.pc small{color:#9fb3c8}.pc .x{position:absolute;right:8px;top:8px;padding:4px 9px;background:#0004}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:30}#ov.on{display:flex}#ovb{background:#0d1b2a;border:1px solid #1e2f44;border-radius:16px;padding:22px;max-width:480px;width:92%}#ovb h3{margin:0 0 12px}#ovb input[type=text]{width:100%;font:inherit;padding:10px;border-radius:10px;border:0;margin-bottom:14px}#ovb .bs{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
html,body{overscroll-behavior:none;touch-action:manipulation}#v3 canvas{touch-action:none}
@media (max-width:760px){header{padding:calc(6px + env(safe-area-inset-top)) 8px 6px;gap:6px;flex-wrap:nowrap}h1{font-size:16px;margin-right:4px;flex:none;white-space:nowrap}h1 span{display:none}.tab{padding:7px 10px;font-size:13px;white-space:nowrap}
 .tb.on{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#0d1b2af2;border-top:1px solid #1e2f44;padding:8px 8px calc(8px + env(safe-area-inset-bottom));flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
 .tb button,.tb .btn{white-space:nowrap;flex:none;padding:10px 12px;font-size:14px}.tb label{white-space:nowrap;flex:none;font-size:13px}.sep{display:none}
 main{margin-bottom:calc(62px + env(safe-area-inset-bottom))}#hint{bottom:8px;left:8px;right:8px;max-width:none;font-size:12.5px}
 #dd{position:fixed;left:8px;right:8px;top:auto;bottom:calc(70px + env(safe-area-inset-bottom));min-width:0}#dd a{padding:14px 16px;font-size:16px}
 .big button{flex:1 1 100%;font-size:17px}.hw{padding:16px 12px}#ovb .bs button{flex:1 1 100%;padding:13px}#st{font-size:12.5px;right:8px}
 #VRButton{bottom:calc(76px + env(safe-area-inset-bottom))!important}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/","three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.1/build/index.module.js"}}</script>
</head><body>
<header><h1 id="logo" style="cursor:pointer" title="Domov – moje projekty">Vkroč <span>Štúdio</span></h1>
<button class="tab on" data-s="ed">1 · Pôdorys</button><button class="tab" data-s="vw">2 · 3D prehliadka</button><div class="sep"></div>
<div class="tb on" id="tbed">
 <button data-t="wall" class="on">✏️ Stena</button><button data-t="move">✋ Posunúť</button><button data-t="door">🚪 Dvere</button><button data-t="window">🪟 Okno</button><button data-t="del">🗑 Zmazať</button>
 <button id="undo">↶ Späť</button>
 <label>Hrúbka steny <input type="range" id="th" min="10" max="60" value="30"><b id="thv">30 cm</b></label><div class="sep"></div>
 <button id="obl">📐 Šikmé steny: VYP</button>
 <button id="upl">🖼 Nahrať výkres</button><button id="rec">🧱 Rozpoznať steny</button><button id="cal">📏 Mierka</button><button data-t="cal" hidden></button>
 <label title="Pokročilé">šírka výkresu <input type="number" id="imw" value="12" step="0.5"> m</label>
 <div style="position:relative"><button id="menu">📁 Projekt ▾</button><div id="dd"><a data-m="new">➕ Nový projekt</a><a data-m="newimg">🖼 Nový projekt z výkresu</a><a data-m="open">📂 Otvoriť projekt (JSON)</a><a data-m="dl">💾 Uložiť / stiahnuť projekt</a><a data-m="mine">🗂 Moje projekty</a><a data-m="demo">🏠 Ukážkový dom</a></div></div>
 <button class="go" id="gen">▶ Vygenerovať 3D</button>
</div>
<div class="tb" id="tbvw"><button id="walk">🚶 Chôdza / 🔄 Pohľad zvonka</button></div>
</header>
<main><div class="scr" id="home"><div class="hw"><h2>Moje projekty</h2><div class="big"><button class="go" id="hNew">➕ Nový projekt</button><button class="go" id="hImg" style="background:#1e6fd9">🖼 Nový projekt z výkresu</button><button id="hDemo">🏠 Ukážka</button></div><div id="plist"></div></div></div><div class="scr on" id="ed"><canvas id="cv"></canvas><div id="hint"></div></div>
<div class="scr" id="vw"><div id="v3"></div><div id="st">Pripravené</div></div></main>
<div id="ov"><div id="ovb"></div></div><input type="file" id="img" accept="image/*" hidden><input type="file" id="ld" accept=".json" hidden>
<script type="module" src="app.js"></script>
</body></html>
